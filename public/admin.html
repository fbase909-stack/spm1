<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ShoppingMart Admin</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@600;700&family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: top bar, then product list (left) and editor (right); stacks on phones */
:root{
  --bg:#F8FAFD;--surface:#FFFFFF;--sunk:#F1F5FA;--ink:#1E293B;--muted:#5D6A7E;--line:#E3E9F1;
  --accent:#0E8476;--accent-ink:#FFFFFF;--accent-soft:#E4F6F2;--good:#1D7D45;--good-soft:#E5F7EC;--bad:#B4402C;--bad-soft:#FDEDE9;--warn:#A66B00;--warn-soft:#FFF5DF;
  --mint:#E9F8F3;--sky:#EAF4FF;
  --f-display:"Familjen Grotesk","Hanken Grotesk",system-ui,sans-serif;--f-body:"Hanken Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;--f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
/* Light theme only. */
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body)}
h1,h2,h3{font-family:var(--f-display);margin:0;line-height:1.2;letter-spacing:-.01em}
h1{font-size:24px}h2{font-size:20px}h3{font-size:16px}
p{margin:0}a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
[hidden]{display:none!important}
img{max-width:100%}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}.small{font-size:13px}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:linear-gradient(90deg,var(--surface),var(--mint));border-bottom:1px solid var(--line)}
.top .gut{display:flex;align-items:center;gap:12px;padding-block:12px;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-weight:700;font-size:18px;display:flex;align-items:center;gap:8px;margin-right:auto}
.brand i{width:26px;height:26px;border-radius:8px;background:var(--accent);display:inline-block}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:38px;padding:0 14px;border-radius:10px;border:1px solid transparent;font-weight:600;cursor:pointer;font-size:14px;text-decoration:none;white-space:nowrap}
.btn:active{transform:scale(.97)}
.pri{background:var(--accent);color:var(--accent-ink)}
.sec{background:var(--surface);border-color:var(--line);color:var(--ink)}
.sec:hover{border-color:var(--accent)}
.danger{background:var(--bad-soft);color:var(--bad)}
.sm{height:32px;padding:0 10px;font-size:13px;border-radius:8px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.in{height:40px;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:0 11px;width:100%;min-width:0}
textarea.in{height:auto;padding:9px 11px;resize:vertical}
.in:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
label.f{display:grid;gap:5px;font-size:13px;font-weight:600}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;font-size:11.5px;font-weight:600;background:var(--sunk);color:var(--muted);white-space:nowrap}
.chip.good{background:var(--good-soft);color:var(--good)}.chip.bad{background:var(--bad-soft);color:var(--bad)}.chip.warn{background:var(--warn-soft);color:var(--warn)}.chip.acc{background:var(--accent-soft);color:var(--accent)}
.layout{display:grid;gap:18px;grid-template-columns:1fr;padding-block:18px 48px;max-width:1400px;margin:0 auto}
@media (min-width:980px){.layout{grid-template-columns:360px 1fr;align-items:start}.list{position:sticky;top:76px;max-height:calc(100vh - 96px);display:flex;flex-direction:column}}
.list .rows{overflow-y:auto;display:grid;gap:4px;margin-top:10px;min-height:0}
.row{display:grid;grid-template-columns:48px 1fr auto;gap:10px;align-items:center;padding:8px;border-radius:10px;cursor:pointer;border:1px solid transparent;background:none;text-align:left;width:100%}
.row:hover{background:var(--sunk)}.row.on{border-color:var(--accent);background:var(--accent-soft)}
.thumb{width:48px;height:48px;border-radius:9px;background:var(--sunk);display:grid;place-items:center;overflow:hidden;font-size:10px;color:var(--muted);text-align:center}
.thumb img{width:100%;height:100%;object-fit:contain}
.sections{display:grid;gap:16px}
.two{display:grid;gap:12px;grid-template-columns:1fr 1fr}
.three{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}
@media (max-width:560px){.two{grid-template-columns:1fr}}
.drop{border:2px dashed var(--line);border-radius:14px;padding:22px;text-align:center;cursor:pointer;transition:border-color .2s,background .2s}
.drop.over,.drop:hover{border-color:var(--accent);background:var(--accent-soft)}
.photos{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));margin-top:14px}
.photo{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface);display:flex;flex-direction:column}
.photo .im{aspect-ratio:1;background:var(--sunk);display:grid;place-items:center;position:relative;max-width:100%}
.photo .im img{width:100%;height:100%;object-fit:contain}
.photo .im .main{position:absolute;top:6px;left:6px}
.photo .ctl{padding:8px;display:grid;gap:6px}
.photo .btns{display:flex;gap:4px}
.photo .btns .btn{flex:1;padding:0 4px}
.prog{height:6px;border-radius:4px;background:var(--sunk);overflow:hidden;margin-top:6px}
.prog i{display:block;height:100%;background:var(--accent);transition:width .2s}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.tbl{overflow-x:auto}
.auth{max-width:420px;margin:48px auto}
.note{background:var(--sunk);border-radius:12px;padding:12px 14px;font-size:13.5px}
.err{color:var(--bad);font-size:13px;font-weight:500}
.toasts{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));display:grid;gap:8px;z-index:50;max-width:calc(100% - 32px)}
.toast{background:var(--surface);color:var(--ink);border:1px solid var(--line);box-shadow:0 8px 24px rgba(30,41,59,.1);padding:10px 14px;border-radius:10px;font-size:14px;animation:tin .25s ease-out}
@keyframes tin{from{opacity:0;transform:translateY(8px)}}
.confirm{border:1px solid var(--bad);background:var(--bad-soft);border-radius:12px;padding:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
code,.code{font-family:var(--f-mono);font-size:12.5px;background:var(--sunk);padding:2px 6px;border-radius:6px;word-break:break-all}
ol{padding-left:20px;margin:8px 0;display:grid;gap:6px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="root"><div class="auth gut"><div class="panel"><p class="muted">Loading admin…</p></div></div></div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<script src="js/catalog.js"></script>
<script type="module">
import { FIREBASE_CONFIG, FIREBASE_SDK, isConfigured } from "./js/firebase-config.js";

/* ---------- helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const inr = p => "₹" + Math.round(p / 100).toLocaleString("en-IN");
const fmtDT = t => new Date(t).toLocaleString("en-IN", { day: "numeric", month: "short", year: "numeric", hour: "numeric", minute: "2-digit" });
const root = $("#root");
function toast(m) { const t = document.createElement("div"); t.className = "toast"; t.textContent = m; $("#toasts").appendChild(t); setTimeout(() => t.remove(), 3500); }
const BASE = {}; RAW.forEach(p => BASE[p.id] = p);
const PALETTE = ["#26272B", "#D9D9DB", "#2E3D5C", "#B9D2E7", "#C7BCE4", "#B5C3A5", "#D7772F", "#8A8C8F"];

/* ---------- not configured ---------- */
if (!isConfigured()) {
  root.innerHTML = `<div class="auth gut" style="max-width:640px"><div class="panel"><h1>Connect Firebase</h1>
  <p class="muted" style="margin:6px 0 14px">The admin panel needs your Firebase project before it can sign you in or save photos.</p>
  <ol><li>Create a project at <a href="https://console.firebase.google.com" target="_blank" rel="noopener">console.firebase.google.com</a>.</li>
  <li>Turn on <b>Authentication → Email/Password</b>, <b>Firestore Database</b> and <b>Storage</b>.</li>
  <li>Add a <b>Web app</b> and copy its config into <code>public/js/firebase-config.js</code>.</li>
  <li>Deploy the rules and the site: <code>firebase deploy</code>.</li></ol>
  <p class="small muted">README.md in the project folder has every step with screenshots described.</p></div></div>`;
} else {
  start().catch(e => { console.error(e); root.innerHTML = `<div class="auth gut"><div class="panel"><h2>Firebase could not load</h2><p class="muted" style="margin-top:8px">${esc(e.message)}. Open this page through a web server (Firebase Hosting or <code>npx serve public</code>), not by double-clicking the file.</p></div></div>`; });
}

async function start() {
  const [{ initializeApp }, A, F, ST] = await Promise.all([
    import(`${FIREBASE_SDK}/firebase-app.js`), import(`${FIREBASE_SDK}/firebase-auth.js`),
    import(`${FIREBASE_SDK}/firebase-firestore.js`), import(`${FIREBASE_SDK}/firebase-storage.js`)]);
  const app = initializeApp(FIREBASE_CONFIG);
  const auth = A.getAuth(app), db = F.getFirestore(app), storage = ST.getStorage(app);
  const S = { user: null, docs: {}, sel: null, q: "", uploads: {}, confirm: null, unsub: null };

  /* ---------- data ---------- */
  const pref = id => F.doc(db, "products", id);
  const save = (id, data) => F.setDoc(pref(id), { ...data, updatedAt: Date.now(), updatedBy: S.user.email }, { merge: true });
  function merged(id) {
    const b = BASE[id], r = S.docs[id] || {};
    const p = b ? { ...b, spec: { ...b.spec, ...(r.spec || {}) } } : { id, cat: r.cat, brand: r.brand || "", series: r.series || "", title: r.title || "(untitled)", base: +r.base || 0, opts: r.opts || [{ v: "Standard", add: 0 }], cols: r.cols || [{ v: "Default", hex: "#8A93A0" }], spec: r.spec || {}, feats: [] };
    for (const f of ["title", "brand", "series", "desc"]) if (r[f]) p[f] = r[f];
    if (Array.isArray(r.feats) && r.feats.length) p.feats = r.feats;
    p.images = (r.images || []).filter(i => i && i.url);
    p.published = r.published !== false; p.isBase = !!b; p.hasDoc = !!S.docs[id];
    p.priceLog = r.priceLog || []; p.stock = r.stock || {};
    return p;
  }
  const latestPrice = (p, oi) => { const l = p.priceLog.filter(e => +e.oi === +oi).sort((a, b) => b.at - a.at)[0]; return l ? l.price : null; };
  const allIds = () => [...new Set([...RAW.map(p => p.id), ...Object.keys(S.docs)])].filter(id => BASE[id] || (S.docs[id] && S.docs[id].title));

  /* ---------- auth screens ---------- */
  function loginView(msg = "") {
    root.innerHTML = `<div class="auth gut"><div class="panel"><div class="brand" style="margin-bottom:14px"><i></i>ShoppingMart Admin</div>
    <form id="login" style="display:grid;gap:12px"><label class="f">Email<input class="in" id="em" type="email" required autocomplete="username"></label>
    <label class="f">Password<input class="in" id="pw" type="password" required autocomplete="current-password"></label>
    <div class="err" id="lerr">${esc(msg)}</div><button class="btn pri">Sign in</button></form>
    <p class="small" style="margin-top:12px"><a href="#" id="forgot">Forgot password?</a> · <a href="index.html">Back to store</a></p></div></div>`;
    $("#login").onsubmit = async e => { e.preventDefault(); $("#lerr").textContent = "";
      try { await A.signInWithEmailAndPassword(auth, $("#em").value.trim(), $("#pw").value); }
      catch (err) { $("#lerr").textContent = err.code === "auth/too-many-requests" ? "Too many attempts. Wait a few minutes and try again." : "That email and password don't match an account."; } };
    $("#forgot").onclick = async e => { e.preventDefault(); const em = $("#em").value.trim(); if (!em) { $("#lerr").textContent = "Type your email first, then choose Forgot password."; return; }
      try { await A.sendPasswordResetEmail(auth, em); toast("Reset email sent if that account exists."); } catch { toast("Could not send the reset email. Check the address."); } };
  }
  function notAdminView(u) {
    root.innerHTML = `<div class="auth gut" style="max-width:600px"><div class="panel"><h2>This account is not an admin yet</h2>
    <p class="muted" style="margin:8px 0 14px">Signed in as ${esc(u.email)}. To make it an admin, add one document in Firestore:</p>
    <ol><li>Firebase console → Firestore Database → <b>Start collection</b> named <code>admins</code>.</li>
    <li>Document ID: <code id="uid">${esc(u.uid)}</code> <button class="btn sec sm" id="cp">Copy</button></li>
    <li>Add a field <code>email</code> (string) = <code>${esc(u.email)}</code>, then save.</li>
    <li>Come back here and choose <b>Check again</b>.</li></ol>
    <div style="display:flex;gap:8px;margin-top:12px"><button class="btn pri" id="again">Check again</button><button class="btn sec" id="out">Sign out</button></div></div></div>`;
    $("#cp").onclick = () => navigator.clipboard.writeText(u.uid).then(() => toast("UID copied")).catch(() => { const r = document.createRange(); r.selectNodeContents($("#uid")); getSelection().removeAllRanges(); getSelection().addRange(r); toast("Press Ctrl/Cmd+C to copy"); });
    $("#again").onclick = () => checkAdmin(u); $("#out").onclick = () => A.signOut(auth);
  }
  async function checkAdmin(u) {
    try { const a = await F.getDoc(F.doc(db, "admins", u.uid)); if (!a.exists()) return notAdminView(u); }
    catch (e) { return notAdminView(u); }
    S.user = u; shell(); subscribe();
  }
  A.onAuthStateChanged(auth, u => { if (S.unsub) { S.unsub(); S.unsub = null; } S.user = null; if (!u) loginView(); else checkAdmin(u); });

  /* ---------- live data ---------- */
  function subscribe() {
    S.unsub = F.onSnapshot(F.collection(db, "products"), snap => {
      snap.forEach(d => S.docs[d.id] = d.data());
      snap.docChanges().forEach(c => { if (c.type === "removed") delete S.docs[c.doc.id]; });
      renderList(); if (S.sel) refreshEditor();
    }, err => toast(err.code === "permission-denied" ? "Firestore rules are blocking reads. Deploy firestore.rules." : "Lost connection to Firestore."));
  }

  /* ---------- shell ---------- */
  function shell() {
    root.innerHTML = `<header class="top"><div class="gut"><div class="brand"><i></i>Shopping<span style="color:var(--accent)">Mart</span>&nbsp;Admin <span class="chip good">Live</span></div>
      <span class="small muted">${esc(S.user.email)}</span><a class="btn sec sm" href="index.html" target="_blank" rel="noopener">View store</a><a class="btn sec sm" href="index.html#admin" target="_blank" rel="noopener">Orders (demo)</a><button class="btn sec sm" data-a="signout">Sign out</button></div></header>
    <div class="layout gut"><aside class="panel list"><div style="display:flex;gap:8px"><input class="in" id="q" placeholder="Search products" aria-label="Search products"><button class="btn pri" data-a="new">Add</button></div>
      <div class="small muted" id="count" style="margin-top:8px"></div><div class="rows" id="rows"></div></aside>
      <main id="ed"><div class="panel"><h2>Choose a product</h2><p class="muted" style="margin-top:6px">Pick a product on the left to upload photos, change details, record a new price or update stock. Saved changes show on the live store within a few seconds.</p></div></main></div>`;
    $("#q").oninput = e => { S.q = e.target.value.toLowerCase(); renderList(); };
    renderList();
  }
  function renderList() {
    const rows = $("#rows"); if (!rows) return;
    const ps = allIds().map(merged).filter(p => !S.q || (p.title + " " + p.brand + " " + p.cat).toLowerCase().includes(S.q)).sort((a, b) => (a.cat + a.brand + a.title).localeCompare(b.cat + b.brand + b.title));
    $("#count").textContent = `${ps.length} products · ${ps.filter(p => p.images.length).length} with photos`;
    rows.innerHTML = ps.map(p => `<button class="row ${S.sel === p.id ? "on" : ""}" data-a="open" data-id="${esc(p.id)}"><span class="thumb">${p.images[0] ? `<img src="${esc(p.images[0].url)}" alt="" loading="lazy">` : "No photo"}</span>
      <span style="min-width:0"><b style="display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(p.title)}</b><span class="small muted">${esc(p.brand)} · ${esc(CATS[p.cat]?.name || p.cat)}</span></span>
      <span style="display:grid;gap:3px;justify-items:end">${p.published ? "" : '<span class="chip warn">Hidden</span>'}${p.isBase ? "" : '<span class="chip acc">New</span>'}<span class="chip">${p.images.length} photo${p.images.length === 1 ? "" : "s"}</span></span></button>`).join("");
  }

  /* ---------- editor ---------- */
  function openEditor(id) {
    S.sel = id; S.confirm = null; renderList();
    const p = merged(id), cat = CATS[p.cat];
    const optKeys = new Set(p.opts.flatMap(o => Object.keys(o.spec || {})));
    const attrs = cat.attrs.filter(a => !optKeys.has(a.k));
    $("#ed").innerHTML = `<div class="sections">
    <div class="panel" style="display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap"><div><span class="small muted">${esc(CATS[p.cat].name)} · ${p.isBase ? "Starter catalog product" : "Added in admin"}</span><h1>${esc(p.title)}</h1></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap"><a class="btn sec sm" href="index.html#p-${esc(id)}" target="_blank" rel="noopener">Open on store</a><label class="btn sec sm" style="gap:8px"><input type="checkbox" id="pub" ${p.published ? "checked" : ""}> Show on store</label></div></div>

    <section class="panel"><h2>Photos</h2><p class="small muted" style="margin:4px 0 12px">The first photo is the main one on product cards. Photos are resized to 1600 px and compressed before upload. JPG, PNG or WebP.</p>
      <label class="drop" id="drop" for="file"><b>Drop photos here or click to choose</b><br><span class="small muted">You can select several at once</span><input type="file" id="file" accept="image/jpeg,image/png,image/webp" multiple hidden></label>
      <div id="ups"></div><div id="photos"></div></section>

    <form class="panel" id="details" style="display:grid;gap:12px"><h2>Details</h2>
      <div class="two"><label class="f">Product name<input class="in" id="d-title" required value="${esc(p.title)}"></label><label class="f">Brand<input class="in" id="d-brand" required value="${esc(p.brand)}"></label></div>
      <div class="two"><label class="f">Product line<input class="in" id="d-series" value="${esc(p.series)}" placeholder="e.g. Galaxy S"></label>
        ${p.isBase ? `<label class="f">Category<input class="in" value="${esc(cat.name)}" disabled></label>` : `<label class="f">Category<select class="in" id="d-cat">${Object.entries(CATS).map(([k, c]) => `<option value="${k}" ${k === p.cat ? "selected" : ""}>${c.name}</option>`).join("")}</select></label>`}</div>
      ${p.isBase ? "" : `<div class="two"><label class="f">Base price (₹)<input class="in" id="d-base" type="number" min="1" required value="${p.base}"></label><span></span></div>
        <label class="f">Variants <span class="muted" style="font-weight:400">one per line: name = extra price over base</span><textarea class="in mono small" id="d-opts" rows="3">${esc(p.opts.map(o => `${o.v} = ${o.add || 0}`).join("\n"))}</textarea></label>
        <label class="f">Colours <span class="muted" style="font-weight:400">one per line: name = hex colour (optional)</span><textarea class="in mono small" id="d-cols" rows="3">${esc(p.cols.map(c => `${c.v} = ${c.hex}`).join("\n"))}</textarea></label>`}
      <label class="f">Description<textarea class="in" id="d-desc" rows="4" placeholder="What it is, who it's for, what's in the box">${esc(p.desc || "")}</textarea></label>
      <label class="f">Key features <span class="muted" style="font-weight:400">one per line</span><textarea class="in" id="d-feats" rows="3">${esc((p.feats || []).join("\n"))}</textarea></label>
      <h3 style="margin-top:6px">Specifications</h3><p class="small muted">Leave a field empty if the brand doesn't publish it. The comparison engine skips empty fields instead of guessing.</p>
      <div class="three">${attrs.map(a => { const v = p.spec[a.k]; const id = "s-" + a.k;
        if (a.fmt) return `<label class="f">${esc(a.l)}<select class="in" id="${id}" data-k="${a.k}" data-t="bool"><option value="" ${v == null ? "selected" : ""}>Not published</option><option value="1" ${v ? "selected" : ""}>Yes</option><option value="0" ${v === 0 || v === false ? "selected" : ""}>No</option></select></label>`;
        const num = a.u && !a.num; return `<label class="f">${esc(a.l)}${a.u ? ` <span class="muted" style="font-weight:400">(${esc(a.u.trim())})</span>` : ""}<input class="in" id="${id}" data-k="${a.k}" data-t="${num ? "num" : "text"}" ${num ? 'type="number" step="any"' : ""} value="${v == null ? "" : esc(v)}"></label>`; }).join("")}</div>
      <div class="err" id="derr"></div>
      <div style="display:flex;gap:8px"><button class="btn pri">Save details</button></div></form>

    <section class="panel" id="prices"></section>
    <section class="panel" id="stock"></section>
    <section class="panel" id="danger"></section></div>`;
    $("#pub").onchange = async e => { await save(id, { published: e.target.checked }); toast(e.target.checked ? "Product is visible on the store" : "Product hidden from the store"); };
    const drop = $("#drop"), file = $("#file");
    file.onchange = () => { uploadFiles(id, [...file.files]); file.value = ""; };
    drop.ondragover = e => { e.preventDefault(); drop.classList.add("over"); };
    drop.ondragleave = () => drop.classList.remove("over");
    drop.ondrop = e => { e.preventDefault(); drop.classList.remove("over"); uploadFiles(id, [...e.dataTransfer.files]); };
    $("#details").onsubmit = e => { e.preventDefault(); saveDetails(id); };
    refreshEditor(); window.scrollTo({ top: 0 });
  }
  function refreshEditor() {
    const id = S.sel; if (!id || !$("#photos")) return; const p = merged(id);
    const pub = $("#pub"); if (pub && document.activeElement !== pub) pub.checked = p.published;
    $("#photos").innerHTML = p.images.length ? `<div class="photos">${p.images.map((im, i) => `<div class="photo"><div class="im"><img src="${esc(im.url)}" alt="${esc(im.alt || p.title)}" loading="lazy">${i === 0 ? '<span class="chip good main">Main</span>' : ""}</div>
      <div class="ctl">${p.cols.length > 1 ? `<select class="in sm" style="height:32px" data-a="colour" data-i="${i}" aria-label="Colour for this photo"><option value="">All colours</option>${p.cols.map(c => `<option ${im.colour === c.v ? "selected" : ""}>${esc(c.v)}</option>`).join("")}</select>` : ""}
      <div class="btns"><button class="btn sec sm" data-a="mv" data-i="${i}" data-d="-1" ${i ? "" : "disabled"} aria-label="Move left">←</button><button class="btn sec sm" data-a="main" data-i="${i}" ${i ? "" : "disabled"}>Main</button><button class="btn sec sm" data-a="mv" data-i="${i}" data-d="1" ${i < p.images.length - 1 ? "" : "disabled"} aria-label="Move right">→</button><button class="btn danger sm" data-a="delimg" data-i="${i}" aria-label="Delete photo">✕</button></div></div></div>`).join("")}</div>`
      : `<p class="muted small" style="margin-top:12px">No photos yet. The store shows an illustration until you upload one.</p>`;
    renderUploads();
    if (!$("#prices").contains(document.activeElement)) renderPrices(p);
    if (!$("#stock").contains(document.activeElement)) renderStock(p);
    renderDanger(p);
  }
  function renderPrices(p) {
    const log = p.priceLog.slice().sort((a, b) => b.at - a.at);
    $("#prices").innerHTML = `<h2>Price</h2><p class="small muted" style="margin:4px 0 12px">Recording a price adds it to the product's price history, updates the store, and triggers any customer price alerts that it meets.</p>
    <div class="tbl"><table><thead><tr><th>Variant</th><th>Current</th><th>New price (₹)</th><th></th></tr></thead><tbody>${p.opts.map((o, oi) => { const lp = latestPrice(p, oi);
      return `<tr><td>${esc(o.v)}</td><td class="mono">${lp ? inr(lp) : `<span class="muted">Sample ${inr((p.base + (+o.add || 0)) * 100)} at launch</span>`}</td><td><input class="in" style="max-width:150px" type="number" min="1" id="np-${oi}" aria-label="New price for ${esc(o.v)}"></td><td><button class="btn pri sm" data-a="price" data-oi="${oi}">Record price</button></td></tr>`; }).join("")}</tbody></table></div>
    ${log.length ? `<h3 style="margin:16px 0 6px">Recorded prices</h3><div class="tbl"><table><thead><tr><th>When</th><th>Variant</th><th>Price</th><th>By</th></tr></thead><tbody>${log.slice(0, 12).map(e => `<tr><td>${fmtDT(e.at)}</td><td>${esc(p.opts[e.oi]?.v || e.oi)}</td><td class="mono">${inr(e.price)}</td><td class="small muted">${esc(e.by || "")}</td></tr>`).join("")}</tbody></table></div>` : ""}`;
  }
  function renderStock(p) {
    $("#stock").innerHTML = `<h2>Stock</h2><p class="small muted" style="margin:4px 0 12px">Units available for each variant and colour. Empty means not set yet, and the store uses sample stock.</p>
    <form id="stockf"><div class="tbl"><table><thead><tr><th>Variant</th>${p.cols.map(c => `<th>${esc(c.v)}</th>`).join("")}</tr></thead><tbody>${p.opts.map((o, oi) => `<tr><td>${esc(o.v)}</td>${p.cols.map((c, ci) => { const sku = `${p.id}~${oi}~${ci}`; return `<td><input class="in mono" style="width:84px" type="number" min="0" data-sku="${esc(sku)}" value="${p.stock[sku] ?? ""}" aria-label="Stock ${esc(o.v)} ${esc(c.v)}"></td>`; }).join("")}</tr>`).join("")}</tbody></table></div>
    <button class="btn pri" style="margin-top:12px">Save stock</button></form>`;
    $("#stockf").onsubmit = async e => { e.preventDefault(); const stock = {};
      e.target.querySelectorAll("[data-sku]").forEach(i => { if (i.value !== "") stock[i.dataset.sku] = Math.max(0, Math.round(+i.value)); });
      try { await save(p.id, { stock }); toast("Stock saved"); } catch (err) { toast("Could not save stock: " + err.code); } };
  }
  function renderDanger(p) {
    const label = p.isBase ? "Reset to starter data" : "Delete product";
    const what = p.isBase ? "This removes your photos, recorded prices, stock and edits for this product. The starter version comes back." : "This deletes the product and all its photos from the store.";
    $("#danger").innerHTML = S.confirm === p.id ? `<div class="confirm"><span style="flex:1;min-width:200px"><b>${label}?</b> ${what}</span><button class="btn sec sm" data-a="cancelDel">Keep it</button><button class="btn danger sm" data-a="doDel">${label}</button></div>`
      : `<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap"><div><h3>${label}</h3><p class="small muted">${what}</p></div><button class="btn danger sm" data-a="askDel" ${p.hasDoc ? "" : "disabled"}>${label}</button></div>`;
  }

  /* ---------- saving ---------- */
  function parseLines(txt, isCol) {
    return txt.split("\n").map(l => l.trim()).filter(Boolean).map((l, i) => { const [a, b] = l.split("=").map(s => (s || "").trim());
      return isCol ? { v: a, hex: /^#[0-9a-f]{6}$/i.test(b) ? b : PALETTE[i % PALETTE.length] } : { v: a, add: Math.max(0, Math.round(+b || 0)), spec: {} }; }).filter(x => x.v);
  }
  async function saveDetails(id) {
    const p = merged(id), err = $("#derr"); err.textContent = "";
    const data = { title: $("#d-title").value.trim(), brand: $("#d-brand").value.trim(), series: $("#d-series").value.trim(), desc: $("#d-desc").value.trim(),
      feats: $("#d-feats").value.split("\n").map(s => s.trim()).filter(Boolean), spec: {} };
    document.querySelectorAll("#details [data-k]").forEach(i => { const v = i.value.trim(); data.spec[i.dataset.k] = v === "" ? null : i.dataset.t === "num" ? +v : i.dataset.t === "bool" ? +v : v; });
    if (!p.isBase) {
      data.cat = $("#d-cat").value; data.base = Math.round(+$("#d-base").value);
      data.opts = parseLines($("#d-opts").value, false); data.cols = parseLines($("#d-cols").value, true);
      if (!data.base) return err.textContent = "Enter a base price.";
      if (!data.opts.length) data.opts = [{ v: "Standard", add: 0, spec: {} }];
      if (!data.cols.length) return err.textContent = "Add at least one colour.";
    }
    if (!data.title || !data.brand) return err.textContent = "Name and brand are required.";
    try { await save(id, data); toast("Details saved. The store updates in a few seconds."); } catch (e) { err.textContent = "Could not save: " + e.code; }
  }
  async function compress(file) {
    const bmp = await createImageBitmap(file);
    const s = Math.min(1, 1600 / Math.max(bmp.width, bmp.height)), w = Math.round(bmp.width * s), h = Math.round(bmp.height * s);
    const c = document.createElement("canvas"); c.width = w; c.height = h; const ctx = c.getContext("2d");
    ctx.drawImage(bmp, 0, 0, w, h);
    let blob = await new Promise(r => c.toBlob(r, "image/webp", 0.85));
    if (!blob || blob.type !== "image/webp") { ctx.globalCompositeOperation = "destination-over"; ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, w, h); blob = await new Promise(r => c.toBlob(r, "image/jpeg", 0.85)); }
    return { blob, w, h };
  }
  function renderUploads() {
    const ups = Object.entries(S.uploads).filter(([, u]) => u.pid === S.sel); const el = $("#ups"); if (!el) return;
    el.innerHTML = ups.map(([k, u]) => `<div class="small" style="margin-top:10px">${esc(u.name)} · ${u.err ? `<span class="err">${esc(u.err)}</span>` : u.done ? "Uploaded" : u.pct + "%"}<div class="prog"><i style="width:${u.done ? 100 : u.pct}%"></i></div></div>`).join("");
  }
  async function uploadFiles(pid, files) {
    const imgs = files.filter(f => /^image\/(jpeg|png|webp)$/.test(f.type));
    if (imgs.length < files.length) toast("Skipped files that aren't JPG, PNG or WebP.");
    for (const f of imgs) {
      const key = Math.random().toString(36).slice(2); S.uploads[key] = { pid, name: f.name, pct: 0 }; renderUploads();
      try {
        if (f.size > 25 * 1024 * 1024) throw new Error("File is over 25 MB");
        const { blob, w, h } = await compress(f);
        if (blob.size > 5 * 1024 * 1024) throw new Error("Still over 5 MB after compressing");
        const ext = blob.type === "image/webp" ? "webp" : "jpg", path = `products/${pid}/${Date.now()}-${key}.${ext}`, r = ST.ref(storage, path);
        const task = ST.uploadBytesResumable(r, blob, { contentType: blob.type, cacheControl: "public,max-age=31536000" });
        await new Promise((res, rej) => task.on("state_changed", s => { S.uploads[key].pct = Math.round(s.bytesTransferred / s.totalBytes * 100); renderUploads(); }, rej, res));
        const url = await ST.getDownloadURL(r);
        await save(pid, { images: F.arrayUnion({ url, path, w, h, colour: "", alt: merged(pid).title, at: Date.now() }) });
        S.uploads[key].done = true;
      } catch (e) { console.error(e); S.uploads[key].err = e.code === "storage/unauthorized" ? "Storage rules blocked the upload. Deploy storage.rules and check you're an admin." : (e.message || "Upload failed"); }
      renderUploads();
      setTimeout(() => { if (S.uploads[key]?.done) { delete S.uploads[key]; renderUploads(); } }, 4000);
    }
    if (imgs.length) toast("Photos uploaded. They're live on the store now.");
  }
  async function setImages(pid, images) { await save(pid, { images }); }

  /* ---------- new product ---------- */
  function newView() {
    S.sel = null; renderList();
    $("#ed").innerHTML = `<form class="panel" id="newf" style="display:grid;gap:12px"><h2>Add a product</h2><p class="small muted">After saving you can upload photos, set stock and fill in specifications.</p>
      <div class="two"><label class="f">Product name<input class="in" id="n-title" required></label><label class="f">Brand<input class="in" id="n-brand" required></label></div>
      <div class="two"><label class="f">Product line<input class="in" id="n-series" placeholder="e.g. Galaxy S"></label><label class="f">Category<select class="in" id="n-cat">${Object.entries(CATS).map(([k, c]) => `<option value="${k}">${c.name}</option>`).join("")}</select></label></div>
      <div class="two"><label class="f">Base price (₹)<input class="in" id="n-base" type="number" min="1" required></label><span></span></div>
      <label class="f">Variants <span class="muted" style="font-weight:400">one per line: name = extra price over base</span><textarea class="in mono small" id="n-opts" rows="3" placeholder="128 GB = 0&#10;256 GB = 6000"></textarea></label>
      <label class="f">Colours <span class="muted" style="font-weight:400">one per line: name = hex colour (optional)</span><textarea class="in mono small" id="n-cols" rows="3" placeholder="Black = #222222&#10;Blue">Black</textarea></label>
      <label class="f">Description<textarea class="in" id="n-desc" rows="3"></textarea></label>
      <div class="err" id="nerr"></div><button class="btn pri" style="justify-self:start">Create product</button></form>`;
    $("#newf").onsubmit = async e => { e.preventDefault();
      const title = $("#n-title").value.trim(), id = title.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 40) + "-" + Math.random().toString(36).slice(2, 6);
      const opts = parseLines($("#n-opts").value, false), cols = parseLines($("#n-cols").value, true);
      if (!cols.length) { $("#nerr").textContent = "Add at least one colour."; return; }
      try { await save(id, { title, brand: $("#n-brand").value.trim(), series: $("#n-series").value.trim(), cat: $("#n-cat").value, base: Math.round(+$("#n-base").value),
        opts: opts.length ? opts : [{ v: "Standard", add: 0, spec: {} }], cols, desc: $("#n-desc").value.trim(), feats: [], spec: {}, images: [], published: true, custom: true, createdAt: Date.now() });
        toast("Product created. Add photos next."); S.docs[id] = S.docs[id] || { title, cat: $("#n-cat").value }; openEditor(id);
      } catch (err) { $("#nerr").textContent = "Could not create: " + err.code; } };
  }

  /* ---------- clicks ---------- */
  document.addEventListener("click", async e => {
    const el = e.target.closest("[data-a]"); if (!el) return; const a = el.dataset.a, id = S.sel;
    if (a === "signout") return A.signOut(auth);
    if (a === "open") return openEditor(el.dataset.id);
    if (a === "new") return newView();
    const p = id && merged(id), i = +el.dataset.i;
    try {
      if (a === "mv") { const im = p.images.slice(), j = i + +el.dataset.d; [im[i], im[j]] = [im[j], im[i]]; await setImages(id, im); }
      if (a === "main") { const im = p.images.slice(); im.unshift(im.splice(i, 1)[0]); await setImages(id, im); toast("Main photo updated"); }
      if (a === "delimg") { const im = p.images[i]; await setImages(id, p.images.filter((_, k) => k !== i)); if (im.path) await ST.deleteObject(ST.ref(storage, im.path)).catch(() => {}); toast("Photo deleted"); }
      if (a === "price") { const v = Math.round(+$("#np-" + el.dataset.oi).value); if (!(v >= 1)) return toast("Enter a price in rupees.");
        await save(id, { priceLog: F.arrayUnion({ oi: +el.dataset.oi, price: v * 100, at: Date.now(), by: S.user.email }) }); $("#np-" + el.dataset.oi).value = ""; toast(`Recorded ${inr(v * 100)}. Live on the store.`); }
      if (a === "askDel") { S.confirm = id; renderDanger(p); }
      if (a === "cancelDel") { S.confirm = null; renderDanger(p); }
      if (a === "doDel") { for (const im of p.images) if (im.path) await ST.deleteObject(ST.ref(storage, im.path)).catch(() => {});
        await F.deleteDoc(pref(id)); delete S.docs[id]; S.confirm = null; toast(p.isBase ? "Reset to starter data" : "Product deleted");
        if (p.isBase) openEditor(id); else { S.sel = null; $("#ed").innerHTML = '<div class="panel"><p class="muted">Product deleted.</p></div>'; renderList(); } }
    } catch (err) { console.error(err); toast("Could not save: " + (err.code || err.message)); }
  });
  document.addEventListener("change", async e => {
    const el = e.target; if (el.dataset.a !== "colour") return; const p = merged(S.sel), im = p.images.slice();
    im[+el.dataset.i] = { ...im[+el.dataset.i], colour: el.value };
    try { await setImages(S.sel, im); toast(el.value ? `Photo shown for ${el.value}` : "Photo shown for all colours"); } catch (err) { toast("Could not save: " + err.code); }
  });
}
</script>
</body>
</html>
